---
layout: default
---

<div id="main" role="main" class="slp-home">
  <section class="hero" aria-labelledby="hero-title">
    <div class="wrap">
      <h1 class="hero__title" id="hero-title">{{ page.hero_title | default: page.title }}</h1>
      {% if page.affiliation %}<p class="hero__affil">{{ page.affiliation }}</p>{% endif %}
      {% if page.lead %}<div class="hero__lead">{{ page.lead | markdownify }}</div>{% endif %}
      {% include slp/cs-example.html %}
    </div>
  </section>

  {{ content }}
</div>
